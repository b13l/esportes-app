<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esportes ao Vivo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <h1>⚽ Esportes ao Vivo</h1>
  <div id="lista-canais" class="grid"></div>

  <!-- Player simples (modal) -->
  <div id="playerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:1000;">
    <button onclick="fecharPlayer()" style="position:absolute; top:10px; right:10px; z-index:10; background:red; color:white; border:none; padding:0.5rem;">✕ Fechar</button>
    <video id="videoPlayer" controls style="width:100%; height:100%;" playsinline crossorigin="anonymous"></video>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
